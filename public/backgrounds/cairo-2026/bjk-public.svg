<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" preserveAspectRatio="xMidYMid slice">
<!-- BJK public pages "Rising Arc" (light, animated), from the BJK 01 court-TV background, drawn for phones and scrolling pages.
     Motifs sit in the middle third so a portrait phone keeps them; arcs run edge to edge for desktops.
     Slow CSS motion (the arc rises and settles, the lines sway, the ball floats); still for reduced motion. -->
<style>
.rise{animation:rise 12s ease-in-out infinite alternate;transform-box:view-box;transform-origin:0 1200px}
.sway{animation:sway 16s ease-in-out infinite alternate;transform-box:view-box;transform-origin:600px 600px}
.draw{stroke-dasharray:1400;animation:draw 9s ease-in-out infinite alternate}
.float{animation:float 5s ease-in-out infinite alternate}
.pulse{animation:pulse 8s ease-in-out infinite alternate}
@keyframes rise{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes sway{from{transform:translate(-16px,8px)}to{transform:translate(16px,-8px)}}
@keyframes draw{from{stroke-dashoffset:420}to{stroke-dashoffset:0}}
@keyframes float{from{transform:translate(-6px,-12px)}to{transform:translate(6px,12px)}}
@keyframes pulse{from{opacity:.3}to{opacity:.55}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.draw{stroke-dashoffset:0}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3F4F4"/><stop offset="1" stop-color="#DEDFDF"/></linearGradient></defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<g class="rise"><path class="pulse" d="M-160 1240C200 820 560 560 1380 520" stroke="#BBBCBC" stroke-width="130" fill="none" stroke-linecap="round"/></g>
<g class="rise"><path class="draw" d="M-120 1120C260 760 560 420 760 400" stroke="#3A3B3B" stroke-width="44" fill="none" stroke-linecap="round" opacity="0.5"/></g>
<g class="sway"><path d="M-60 700C260 820 560 960 760 1260M0 620C330 760 620 900 820 1260" stroke="#000" stroke-width="3" fill="none" opacity="0.28"/></g>
<g class="sway"><path d="M330 920L560 1060" stroke="#3A3B3B" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.35"/></g>
<g class="float"><circle cx="822" cy="392" r="36" fill="#3A3B3B" opacity="0.85"/></g>
</svg>

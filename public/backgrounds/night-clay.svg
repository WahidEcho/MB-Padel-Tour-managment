<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" preserveAspectRatio="xMidYMid slice">
  <!-- Night clay: the Cairo 2026 event background. Clay light on a night sky, court
       lines drifting behind, a line drawn in ball-yellow every 20 s, ball arcs crossing. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.55" y2="1">
      <stop offset="0" stop-color="#1a1420"/>
      <stop offset="0.55" stop-color="#0c1626"/>
      <stop offset="1" stop-color="#07101c"/>
    </linearGradient>
    <radialGradient id="clay" cx="0.78" cy="0.18" r="0.62">
      <stop offset="0" stop-color="#c0552f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c0552f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blue" cx="0.1" cy="1" r="0.55">
      <stop offset="0" stop-color="#284a82" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#284a82" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#clay)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="18s" repeatCount="indefinite"/>
  </rect>
  <rect width="1920" height="1080" fill="url(#blue)"/>
  <g opacity="0.16" fill="none" stroke="#ffffff" stroke-width="3">
    <animateTransform attributeName="transform" type="rotate" values="-4 960 540;3 960 540;-4 960 540" dur="120s" repeatCount="indefinite"/>
    <g transform="translate(-240 -160)">
      <rect x="300" y="250" width="1800" height="900"/>
      <line x1="300" y1="362" x2="2100" y2="362"/>
      <line x1="300" y1="1038" x2="2100" y2="1038"/>
      <line x1="1200" y1="250" x2="1200" y2="1150" stroke-width="5"/>
      <line x1="780" y1="362" x2="780" y2="1038"/>
      <line x1="1620" y1="362" x2="1620" y2="1038"/>
      <line x1="780" y1="700" x2="1620" y2="700"/>
